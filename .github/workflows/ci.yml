name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # node-gyp still imports distutils, which Python removed in 3.12 —
      # GitHub's runner images now default to 3.12+. Same fix as the release
      # workflow; see the comment there for the full explanation.
      - name: Set up Python (node-gyp needs distutils, removed in 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Native modules (better-sqlite3, argon2, ssh2) compile here because
      # pnpm-workspace.yaml allows their build scripts.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # apps/desktop's own postinstall (electron-builder install-app-deps —
      # genuinely wanted for local dev) just ran as part of the install above
      # and rebuilt better-sqlite3, argon2 and cpu-features for Electron's
      # Node ABI. Everything below runs under plain Node 20, which needs the
      # plain-Node ABI instead. This is the exact fault the test checklist
      # documents for local dev ("rebuild for Node to test, rebuild for
      # Electron to launch") — happening automatically here since nothing
      # prompts a human to redo it between CI steps. One rebuild, once, before
      # anything else in this job touches the native modules.
      #
      # `npm rebuild`, not `pnpm rebuild`: pnpm's rebuild command does not
      # find packages under node-linker=hoisted (pnpm/pnpm#5560, still open),
      # so it exits 0 having done nothing. The modules stayed on Electron's
      # ABI and every test that opens a database failed with
      # NODE_MODULE_VERSION 128 vs 115. The hoisted layout is a plain
      # npm-style tree, so npm's own rebuild works on it.
      - name: Rebuild native modules for plain Node
        run: npm rebuild better-sqlite3 argon2 cpu-features

      # A rebuild that silently does nothing is what made the above so hard
      # to spot: the step goes green and the failure surfaces much later as
      # 30-odd unrelated-looking test errors. Load the module here, where a
      # mismatch names itself immediately.
      - name: Verify native modules load under plain Node
        run: |
          node -e "
            require('better-sqlite3');
            require('argon2');
            console.log('native modules load under Node ' + process.versions.node +
                        ' (ABI ' + process.versions.modules + ')');
          "

      # The API and web packages import from the compiled output of the
      # workspace packages, so those must be built before typecheck/tests
      # run on a clean clone. @skiff/core is the engine (SSH, vault,
      # recording, audit, db); @skiff/shared is the type package.
      - name: Build workspace packages
        run: |
          pnpm --filter @skiff/core build
          pnpm --filter @skiff/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Core engine tests
        run: pnpm --filter @skiff/core test

      # The desktop IPC handlers are deliberately Electron-free (they import
      # contract.ts, not registry.ts), so they run headlessly here with no
      # display server.
      #
      # The harness defaults to a shim backed by node:sqlite, which only
      # exists in Node 22.5+ — this job runs Node 20, so the default fails
      # with ERR_UNKNOWN_BUILTIN_MODULE before a single test executes. That
      # default was there because better-sqlite3 could not be relied on in
      # CI, which was itself a symptom of the rebuild step above silently
      # doing nothing. With the rebuild fixed, use the real driver: it works
      # here, and it is the one the app actually ships with.
      - name: Desktop IPC tests
        run: pnpm --filter @skiff/desktop test
        env:
          SKIFF_TEST_REAL_SQLITE: "1"

      - name: API integration tests
        run: pnpm --filter @skiff/api test

      - name: Build
        run: pnpm build
