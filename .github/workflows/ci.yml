name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # node-gyp still imports distutils, which Python removed in 3.12 —
      # GitHub's runner images now default to 3.12+. Same fix as the release
      # workflow; see the comment there for the full explanation.
      - name: Set up Python (node-gyp needs distutils, removed in 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Native modules (better-sqlite3, argon2, ssh2) compile here because
      # pnpm-workspace.yaml allows their build scripts.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # apps/desktop's own postinstall (electron-builder install-app-deps —
      # genuinely wanted for local dev) just ran as part of the install above
      # and rebuilt better-sqlite3, argon2 and cpu-features for Electron's
      # Node ABI. Everything below runs under plain Node 20, which needs the
      # plain-Node ABI instead. This is the exact fault the test checklist
      # documents for local dev ("rebuild for Node to test, rebuild for
      # Electron to launch") — happening automatically here since nothing
      # prompts a human to redo it between CI steps. One rebuild, once, before
      # anything else in this job touches the native modules.
      - name: Rebuild native modules for plain Node
        run: pnpm rebuild better-sqlite3 argon2 cpu-features

      # The API and web packages import from the compiled output of the
      # workspace packages, so those must be built before typecheck/tests
      # run on a clean clone. @skiff/core is the engine (SSH, vault,
      # recording, audit, db); @skiff/shared is the type package.
      - name: Build workspace packages
        run: |
          pnpm --filter @skiff/core build
          pnpm --filter @skiff/shared build

      # apps/desktop declares @skiff/core and @skiff/shared as `injected`, so
      # pnpm copies them into node_modules instead of symlinking. The copies
      # only carry each package's "files" (dist), and the install above ran
      # before dist existed — so re-install now that it does, or anything
      # resolving through node_modules/@skiff/* finds an empty package.
      - name: Re-sync injected workspace packages
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Core engine tests
        run: pnpm --filter @skiff/core test

      # The desktop IPC handlers are deliberately Electron-free (they import
      # contract.ts, not registry.ts), so they run headlessly here with no
      # display server. better-sqlite3 cannot compile in every CI image, so
      # the runner substitutes Node 22's built-in node:sqlite; set
      # SKIFF_TEST_REAL_SQLITE=1 to force the native driver locally.
      - name: Desktop IPC tests
        run: pnpm --filter @skiff/desktop test

      - name: API integration tests
        run: pnpm --filter @skiff/api test

      - name: Build
        run: pnpm build
