name: Desktop Release

# Builds the Skiff desktop app for Windows, macOS and Linux.
#
# Native modules (better-sqlite3, argon2) must be compiled against Electron's
# own Node ABI, and that compilation has to happen on the target OS — a macOS
# build cannot be produced from Windows. Hence the matrix: each runner builds
# its own platform's artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to a draft release"
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms when one fails — a macOS signing
      # problem shouldn't throw away a good Windows build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            command: package:linux
          - os: windows-latest
            name: Windows
            command: package:win
          - os: macos-latest
            name: macOS
            command: package:mac

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      # Full install WITH build scripts: unlike the CI typecheck job, the
      # native modules genuinely have to compile here.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @skiff/core build
          pnpm --filter @skiff/shared build

      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        run: pnpm exec electron-builder install-app-deps

      - name: Package
        working-directory: apps/desktop
        run: pnpm ${{ matrix.command }} --publish never
        env:
          # Artifacts are distributed from skiffssh.me, not GitHub Releases, so
          # nothing is published from here. --publish never keeps electron-builder
          # from uploading anywhere; the files come back as workflow artifacts
          # and get put on the site.
          SKIFF_PUBLISH: "never"
          # macOS signing. Absent on forks and first-time builds, in which
          # case electron-builder produces an unsigned app — usable for
          # testing, but Gatekeeper will warn end users.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder notarizes only when all three Apple values are
          # present. Without them the build still succeeds unsigned, which is
          # what a fork or a first test build needs.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12 != '' }}

      # Checksums are published on the download page. A security tool that
      # doesn't let people verify what they downloaded undercuts its own pitch,
      # and generating them here means they always match the actual artifacts
      # rather than being pasted by hand later.
      - name: Generate checksums
        working-directory: apps/desktop/release
        shell: bash
        run: |
          for f in *.exe *.dmg *.AppImage *.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt 2>/dev/null || shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt || echo "no artifacts to checksum"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skiff-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # ── Publish to Cloudflare R2 ────────────────────────────────────────────
  #
  # Artifacts are distributed from dl.skiffssh.me, not GitHub Releases, so the
  # upload happens here rather than through electron-builder's own publisher
  # (which stays on --publish never above).
  #
  # The `latest*.yml` files are what electron-updater actually reads; the
  # binaries alone are not enough. An update feed missing its yml is the single
  # failure mode you cannot patch remotely, so they are uploaded in the same
  # step as the binaries and never separately.
  #
  # Required repository secrets:
  #   R2_ACCOUNT_ID         Cloudflare account id
  #   R2_ACCESS_KEY_ID      R2 API token, Object Read & Write
  #   R2_SECRET_ACCESS_KEY  the matching secret
  #   R2_BUCKET             bucket name behind dl.skiffssh.me
  publish:
    name: Publish to R2
    needs: build
    runs-on: ubuntu-latest
    # Tags publish. A manual run only publishes when explicitly asked, so a
    # test build cannot overwrite the live update feed by accident.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Each platform job wrote its own SHA256SUMS.txt. Merge them into one
      # file for the download page, sorted so the order is stable between
      # releases and a diff means something.
      - name: Merge checksums
        run: |
          mkdir -p out
          find dist -name 'SHA256SUMS.txt' -exec cat {} + | sort -k2 > out/SHA256SUMS.txt
          find dist -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} out/ \;
          echo "--- publishing ---"
          ls -la out
          echo "--- checksums ---"
          cat out/SHA256SUMS.txt

      # Fail loudly rather than publishing a release nobody can update to.
      - name: Verify the update feed is present
        run: |
          shopt -s nullglob
          ymls=(out/latest*.yml)
          if [ ${#ymls[@]} -eq 0 ]; then
            echo "::error::No latest*.yml found. electron-updater cannot work without it; refusing to publish."
            exit 1
          fi
          printf 'found: %s\n' "${ymls[@]}"

      # The AWS CLI is pre-installed on ubuntu runners and speaks R2's
      # S3-compatible API. Deliberately not a third-party upload action: this
      # step holds credentials that can rewrite the update feed for every
      # installed copy of Skiff, and that is not a reasonable thing to hand to
      # an unpinned action in a security tool's release path.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail

          # Binaries are immutable once published — a given version's installer
          # never changes — so they cache hard.
          aws s3 sync out "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --exclude '*' \
            --include '*.exe' --include '*.dmg' --include '*.AppImage' \
            --include '*.deb' --include '*.blockmap' \
            --cache-control 'public, max-age=31536000, immutable' \
            --no-progress

          # The feed and checksums must NOT cache hard: these are the files
          # that change on every release, and a stale latest.yml at the edge
          # means clients keep seeing the previous version as newest. Five
          # minutes is short enough that a bad release can be pulled quickly.
          aws s3 sync out "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --exclude '*' \
            --include 'latest*.yml' --include 'SHA256SUMS.txt' \
            --content-type 'text/plain; charset=utf-8' \
            --cache-control 'public, max-age=300, must-revalidate' \
            --no-progress

          echo "Published to $BUCKET"

      # Reads the feed back through the public domain, not the API endpoint,
      # so this also proves the custom domain and CDN are actually serving it.
      - name: Verify the published feed is reachable
        run: |
          set -euo pipefail
          for f in out/latest*.yml; do
            name=$(basename "$f")
            echo "checking https://dl.skiffssh.me/$name"
            code=$(curl -s -o /tmp/pub.yml -w '%{http_code}' "https://dl.skiffssh.me/$name" || true)
            if [ "$code" != "200" ]; then
              echo "::error::dl.skiffssh.me/$name returned $code — the update feed is not live."
              exit 1
            fi
            diff -q "$f" /tmp/pub.yml || {
              echo "::warning::$name served does not match what was uploaded (CDN may still be catching up)."
            }
          done
