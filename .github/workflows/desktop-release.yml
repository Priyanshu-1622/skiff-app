name: Desktop Release

# Builds the Skiff desktop app for Windows, macOS and Linux.
#
# Native modules (better-sqlite3, argon2) must be compiled against Electron's
# own Node ABI, and that compilation has to happen on the target OS — a macOS
# build cannot be produced from Windows. Hence the matrix: each runner builds
# its own platform's artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to a draft release"
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # Bound here because the `secrets` context is NOT valid inside a step's
      # `if:` — GitHub rejects the whole workflow at parse time with
      # "Unrecognized named-value: 'secrets'", and none of the jobs run. Only
      # github, needs, vars, env, inputs and steps are allowed there, so the
      # secret is mirrored into env and the condition tests that instead.
      # Empty when the secret does not exist, which is what we check for.
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
    strategy:
      # Don't cancel the other platforms when one fails — a macOS signing
      # problem shouldn't throw away a good Windows build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            command: package:linux
          # Pinned, not windows-latest. GitHub moved windows-latest to
          # Visual Studio 2026 (internal version 18.x) in mid-June 2026, and
          # node-gyp does not recognize that version yet — a currently open
          # upstream bug (nodejs/node-gyp#3282), not something fixable from
          # here by upgrading anything. GitHub's own changelog gives this
          # exact fix for anyone not ready for VS2026: pin to windows-2022,
          # which still ships VS2022 (17.x) and is fully node-gyp-supported.
          - os: windows-2022
            name: Windows
            command: package:win
          - os: macos-latest
            name: macOS
            command: package:mac

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      # node-gyp (used to compile better-sqlite3, argon2, cpu-features) still
      # imports distutils internally, which Python removed in 3.12. GitHub's
      # runner images default to 3.12+ now, on every OS — which is exactly
      # why this broke identically on Windows, macOS and Linux at once rather
      # than looking like a platform-specific problem. Pinning to 3.11 here
      # is enough: actions/setup-python puts it first on PATH on all three
      # platforms, so node-gyp's own auto-detection finds it with no further
      # config — no manual python path needed, which matters because a
      # hand-built path breaks on Windows anyway (no bin/ subdirectory there).
      - name: Set up Python (node-gyp needs distutils, removed in 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Full install WITH build scripts: unlike the CI typecheck job, the
      # native modules genuinely have to compile here.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @skiff/core build
          pnpm --filter @skiff/shared build

      # electron-builder walks resolved real paths, and app-builder-lib's
      # getRelativePath() throws on any file that is neither under the app dir
      # nor inside a "/node_modules/" segment. pnpm symlinks @skiff/core, which
      # resolves to packages/core — no node_modules segment — so packaging died
      # on packages/core/LICENSE. This replaces those links with real
      # directories containing dist + package.json + LICENSE.
      #
      # Must run after the workspace build (dist has to exist) and before
      # electron-builder. Any `pnpm install` after this point recreates the
      # symlinks and reintroduces the failure.
      #
      # Not done via node-linker=hoisted (hoisting applies to registry
      # packages; workspace links stay symlinks) or dependenciesMeta.injected
      # (needs pnpm's isolated linker, which node-linker=hoisted disables).
      - name: Dereference workspace symlinks for packaging
        run: node scripts/dereference-workspace-deps.mjs

      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        run: pnpm exec electron-builder install-app-deps

      # Exported here rather than in the Package step's `env:` block, because
      # a workflow expression resolving to an empty string still *defines* the
      # variable — see the CSC note below. Skipped until a cert exists.
      - name: Configure macOS code signing
        if: runner.os == 'macOS' && env.MAC_CERT_P12 != ''
        run: |
          {
            echo "CSC_LINK=${{ secrets.MAC_CERT_P12 }}"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Package
        working-directory: apps/desktop
        # Only a real version tag (or an explicit manual request) publishes.
        # electron-builder creates the release as a DRAFT when three separate
        # OS runners each attach their own platform's assets — this is
        # deliberate, so a user can't land on a release mid-run and find only
        # one platform's build there. Publish the draft by hand on GitHub once
        # all three matrix jobs have finished.
        run: pnpm ${{ matrix.command }} --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing variables are deliberately NOT listed here.
          #
          # `CSC_LINK: ${{ secrets.MAC_CERT_P12 }}` looks harmless when the
          # secret does not exist, but it sets the variable to an EMPTY
          # STRING, which is not the same as leaving it unset.
          # electron-builder sees a defined CSC_LINK, treats it as a path to
          # a certificate, and path.resolve("") returns the working directory
          # — which is how this produced "apps/desktop not a file" on macOS.
          #
          # The signing values are exported by the conditional step above
          # instead, which is skipped entirely until a certificate exists, so
          # the variables stay genuinely unset. Without one macOS builds
          # unsigned: fine for testing, and Gatekeeper refuses it for end
          # users, which is why the download page marks macOS coming soon.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Checksums are published on the download page. A security tool that
      # doesn't let people verify what they downloaded undercuts its own pitch,
      # and generating them here means they always match the actual artifacts
      # rather than being pasted by hand later.
      - name: Generate checksums
        working-directory: apps/desktop/release
        shell: bash
        run: |
          for f in *.exe *.dmg *.AppImage *.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt 2>/dev/null || shasum -a 256 "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt || echo "no artifacts to checksum"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skiff-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14


  # electron-builder's own publish step only uploads the artifact types it
  # recognizes (installers, latest*.yml, .blockmap) — not the SHA256SUMS.txt
  # each platform job generates separately, and each job only has its own
  # platform's hashes anyway. This merges the three into the single file the
  # download page promises, and attaches it after all platforms have landed.
  checksums:
    name: Merge and attach checksums
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write
    steps:
      - name: Download each platform's checksum artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge into one file
        run: |
          find dist -name 'SHA256SUMS.txt' -exec cat {} + | sort -k2 > SHA256SUMS.txt
          echo "--- merged ---"
          cat SHA256SUMS.txt

      # gh is preinstalled on GitHub-hosted runners; GITHUB_TOKEN already
      # covers it, no separate secret. --clobber so re-running this workflow
      # for the same tag (e.g. after fixing a platform build) replaces the
      # file instead of failing on a duplicate.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt \
            --clobber --repo "${{ github.repository }}"
